    </linearGradient>
    <radialGradient id="g1" cx=".2" cy=".25" r=".5"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".85" cy=".3" r=".5"><stop offset="0" stop-color="#fb7185" stop-opacity=".5"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient>
